name: Record geometry and visibility on startup qualification failure
on:
  push:
    branches: [release/v1.0.71]
    paths: [.github/workflows/async-geometry-diagnostics.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python qualification/async-geometry-diagnostics.py
      - name: Save diagnostics without relaxing geometry or capture guards
        run: |
          git config user.name 'DCM reviewed-test automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/native/dcm-sumatra-probe.cs tools/test-ui-sumatra-startup.ps1
          git commit -m 'test: preserve host visibility and bounds when startup geometry fails'
          git push origin HEAD:release/v1.0.71
