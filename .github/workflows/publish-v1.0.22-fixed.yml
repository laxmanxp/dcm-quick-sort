name: Publish DCM Quick Sort v1.0.22 Fixed

on:
  push:
    paths:
      - ".github/workflows/publish-v1.0.22-fixed.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Recover exact 1.0.22 source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dcm122
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          files = [
              "release-src/v1.0.22/source-prefix-00.b64",
              "release-src/v1.0.22/source-prefix-01.b64",
              "release-src/v1.0.22/source-prefix-02.b64",
              "release-src/v1.0.22/source-suffix-00.b64",
              "release-src/v1.0.22/source-suffix-01.b64",
              "release-src/v1.0.22/source-suffix-02.b64",
          ]
          expected_lengths = [7000, 7000, 6023, 9000, 9000, 6697]
          expected_hashes = [
              "2084910d816e99983687125ba8a71a2d9e59eb119a7659a9c05fb85c9621a7cf",
              "17f2c61782720bb3e6e2d6804e8508c35019d20294cf7a57f9446e9297d3b986",
              "510903a68eaf62233ca9744ea79aa296d99298aeb594e81f43e15eaaadea94f9",
              "9ab5a8880cc63e7376816dfadadf468026d103bedaa733d0fcb62535500c1de0",
              "2e8d90fb76167c53451298954492234d617b31c86a5c1b2de5815a6ba09bed12",
              "20a51a58d4a36bd26b877823f19938078d02d4017775e967895bc67f33f12bb9",
          ]
          parts = []
          for i, path in enumerate(files):
              part = Path(path).read_text().strip()
              digest = hashlib.sha256(part.encode()).hexdigest()
              print(f"part {i}: len={len(part)} sha256={digest}")
              assert len(part) == expected_lengths[i], (i, len(part), expected_lengths[i])
              assert digest == expected_hashes[i], (i, digest, expected_hashes[i])
              parts.append(part)

          full = "".join(parts)
          assert len(full) == 44720, len(full)
          Path("/tmp/dcm122/source.tar.gz.b64").write_text(full)
          print("Verified complete base64 characters:", len(full))
          PY
          base64 -d /tmp/dcm122/source.tar.gz.b64 > /tmp/dcm122/source.tar.gz
          test "$(stat -c%s /tmp/dcm122/source.tar.gz)" = "33538"
          echo "6f9c6084440d1d518c52fa8e1e640cdf00bd6c0bd1d20df50cb230bc76227f44  /tmp/dcm122/source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/dcm122/source.tar.gz -C /tmp/dcm122
          mkdir -p /tmp/dcm122/installer-src/payload "$GITHUB_WORKSPACE/dist"

      - name: Qualify Windows source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dcm122/app-src
          GOOS=windows GOARCH=amd64 go vet -unsafeptr=false ./...
          cd /tmp/dcm122/installer-src
          GOOS=windows GOARCH=amd64 go vet -unsafeptr=false ./...

      - name: Build portable app
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dcm122/app-src
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H=windowsgui -s -w" -o "$GITHUB_WORKSPACE/dist/DCM-QuickSort-v1.0.22-windows-x64.exe" .
          cp "$GITHUB_WORKSPACE/dist/DCM-QuickSort-v1.0.22-windows-x64.exe" /tmp/dcm122/installer-src/payload/DCM-QuickSort.exe

      - name: Build installer
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dcm122/installer-src
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H=windowsgui -s -w" -o "$GITHUB_WORKSPACE/dist/DCM-QuickSort-Setup-v1.0.22.exe" .
          file "$GITHUB_WORKSPACE/dist/"*.exe
          sha256sum "$GITHUB_WORKSPACE/dist/"*.exe | tee "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"

      - name: Publish v1.0.22 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          DCM : Quick Sort 1.0.22

          Highlights:
          - Complete Files | Preview | Processed workspace
          - Select any matching file for preview and processing
          - Processed session history with selective Undo
          - Native Windows styling
          - Image auto-fit and Edge PDF fit helper
          - Named destination aliases managed with a normal folder picker
          - Selecting an alias displays the complete destination path
          - Alignment grid fixes for Name, Destination, Path and action controls
          - Keyboard-first workflow with visible Alt shortcuts

          Free app · Donation supported · No account required.

          The Windows installer is per-user and does not require administrator access.
          EOF

          if gh release view v1.0.22 >/dev/null 2>&1; then
            gh release upload v1.0.22 \
              dist/DCM-QuickSort-Setup-v1.0.22.exe \
              dist/DCM-QuickSort-v1.0.22-windows-x64.exe \
              dist/SHA256SUMS.txt --clobber
          else
            gh release create v1.0.22 \
              dist/DCM-QuickSort-Setup-v1.0.22.exe \
              dist/DCM-QuickSort-v1.0.22-windows-x64.exe \
              dist/SHA256SUMS.txt \
              --target main \
              --title "DCM : Quick Sort 1.0.22" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v1.0.22 --json name,tagName,url,assets
