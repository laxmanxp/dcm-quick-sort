name: Record verified DCM-27 checkpoint
on:
  push:
    branches: [release/v1.0.71]
    paths:
      - qualification/record-dcm27-checkpoint.py
      - .github/workflows/record-dcm27-checkpoint.yml
permissions:
  contents: write
concurrency:
  group: dcm27-checkpoint
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.71
      - name: Apply only guarded metadata updates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 qualification/record-dcm27-checkpoint.py
          printf '%s\n' \
            '2310bda5ce6d5f81d2c52129e088de1c699a87e9741ef97160bf336b0e74f882  todo.json' \
            '290d1ee7a4c1e5be6ebeddc947609cb11f968a1b79a533b37928cef398fd4d89  qualification/completion-50.json' | sha256sum -c -
          python3 - <<'PY'
          import subprocess
          paths = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert paths == {'todo.json','qualification/completion-50.json'}, paths
          PY
          git diff --check
          git config user.name 'DCM checkpoint automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add todo.json qualification/completion-50.json
          git commit -m 'test: close only DCM-27 after fresh native image qualification'
          git push origin HEAD:refs/heads/release/v1.0.71
      - uses: actions/upload-artifact@v4
        with:
          name: dcm27-verified-checkpoint
          path: |
            todo.json
            qualification/completion-50.json
            qualification/RESUME.md
            qualification/dcm27-complete.md
            qualification/evidence/dcm-27-native-summary.json
          retention-days: 1
