# Refresh pinned source for nonblocking Sumatra startup and cancellation ownership.
name: Export pinned DCM source for local review
on:
  push:
    branches: [release/v1.0.71]
    paths: [.github/workflows/export-dcm-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source without host files or secrets
        run: |
          git rev-parse HEAD > source-commit.txt
          git archive --format=zip --output=dcm-source.zip HEAD app-src installer-src tests tools qualification todo.json
          sha256sum dcm-source.zip > source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dcm-source-${{ github.sha }}
          path: |
            dcm-source.zip
            source-commit.txt
            source-sha256.txt
          retention-days: 1
