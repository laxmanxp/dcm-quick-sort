name: Record verified DCM-23 checkpoint
on:
  push:
    branches: [release/v1.0.71]
    paths:
      - qualification/record-dcm23-checkpoint.py
      - .github/workflows/record-dcm23-checkpoint.yml
permissions:
  contents: write
concurrency:
  group: dcm23-checkpoint
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.71
      - name: Apply only guarded tracker updates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 qualification/record-dcm23-checkpoint.py
          python3 - <<'PY'
          import subprocess
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) == {'todo.json','qualification/completion-50.json'}
          PY
          git diff --check
          git diff --stat
          git config user.name 'DCM verified-checkpoint automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add todo.json qualification/completion-50.json
          git commit -m 'test: close DCM-23 after native Next fix and reviewed navigation acceptance'
          git push origin HEAD:refs/heads/release/v1.0.71
          git rev-parse HEAD > checkpoint-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dcm23-verified-checkpoint
          retention-days: 1
          path: |
            checkpoint-commit.txt
            todo.json
            qualification/completion-50.json
            qualification/2026-11-11-dcm23.md
            qualification/evidence/dcm-23-native-summary.json
