name: Record verified DCM-24 checkpoint
on:
  push:
    branches: [release/v1.0.71]
    paths:
      - qualification/record-dcm24-checkpoint.py
      - .github/workflows/record-dcm24-checkpoint.yml
permissions:
  contents: write
concurrency:
  group: dcm24-checkpoint
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.71
      - name: Apply guarded locally validated metadata
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 qualification/record-dcm24-checkpoint.py
          echo '5e9b0147b4a8f605139ae2896c0680260102e1a3ab02d2c99853f8c948e26c7c  todo.json' | sha256sum -c -
          echo '9443c18280c9380c4a30128d2447f7e8628cfd09eda8aef3830bfe91aecc611f  qualification/completion-50.json' | sha256sum -c -
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf 'qualification/completion-50.json\ntodo.json')"
          git config user.name 'DCM reviewed-checkpoint automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add todo.json qualification/completion-50.json
          git commit -m 'docs: close only DCM-24 after native selected-set and visual acceptance'
          git push origin HEAD:refs/heads/release/v1.0.71
