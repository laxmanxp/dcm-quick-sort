name: Publish DCM Quick Sort v1.0.22

on:
  push:
    paths:
      - ".github/workflows/publish-v1.0.22.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Restore exact 1.0.22 source
        shell: bash
        run: |
          mkdir -p /tmp/dcm122
          cat > /tmp/dcm122/source.tar.gz.b64 <<'EOF'
[... ELLIPSIZATION ...]
EOF
          base64 -d /tmp/dcm122/source.tar.gz.b64 > /tmp/dcm122/source.tar.gz
          tar -xzf /tmp/dcm122/source.tar.gz -C /tmp/dcm122
          rm /tmp/dcm122/source.tar.gz.b64
          mkdir -p /tmp/dcm122/installer-src/payload dist

      - name: Qualify Windows source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dcm122/app-src
          GOOS=windows GOARCH=amd64 go vet -unsafeptr=false ./...
          cd /tmp/dcm122/installer-src
          GOOS=windows GOARCH=amd64 go vet -unsafeptr=false ./...

      - name: Build portable app
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dcm122/app-src
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H=windowsgui -s -w" -o "$GITHUB_WORKSPACE/dist/DCM-QuickSort-v1.0.22-windows-x64.exe" .
          cp "$GITHUB_WORKSPACE/dist/DCM-QuickSort-v1.0.22-windows-x64.exe" /tmp/dcm122/installer-src/payload/DCM-QuickSort.exe

      - name: Build installer
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dcm122/installer-src
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H=windowsgui -s -w" -o "$GITHUB_WORKSPACE/dist/DCM-QuickSort-Setup-v1.0.22.exe" .
          file "$GITHUB_WORKSPACE/dist/"*.exe
          sha256sum "$GITHUB_WORKSPACE/dist/"*.exe | tee "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"

      - name: Publish v1.0.22 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
DCM : Quick Sort 1.0.22

Current workflow:
- Files | Preview | Processed three-column workspace
- Select any matching file for preview and processing
- Session Processed history with selective Undo
- Native Windows visual styling
- Image auto-fit and Edge PDF fit helper
- Named destination aliases managed through a simple folder-picker form
- Selecting an alias shows the complete destination path
- Alignment grid fixes for Name, Destination, Path and action controls
- Keyboard-first workflow and visible Alt shortcuts

Free app · Donation supported · No account required.

The Windows installer is per-user and does not require administrator access.
EOF
          )
          if gh release view v1.0.22 >/dev/null 2>&1; then
            gh release upload v1.0.22 dist/DCM-QuickSort-Setup-v1.0.22.exe dist/DCM-QuickSort-v1.0.22-windows-x64.exe dist/SHA256SUMS.txt --clobber
          else
            gh release create v1.0.22 \
              dist/DCM-QuickSort-Setup-v1.0.22.exe \
              dist/DCM-QuickSort-v1.0.22-windows-x64.exe \
              dist/SHA256SUMS.txt \
              --target main \
              --title "DCM : Quick Sort 1.0.22" \
              --notes "$NOTES"
          fi
