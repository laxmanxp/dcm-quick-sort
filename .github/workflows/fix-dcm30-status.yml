name: Correct native preview status
on:
  push:
    branches: [release/v1.0.71]
    paths: [.github/workflows/fix-dcm30-status.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - run: python qualification/fix-dcm30-status.py
      - name: Test DOCX contracts and compile Windows tests
        working-directory: app-src
        run: |
          go test -count=1 -run 'Test(DOCX|RenderDOCX|ParseDOCX)' .
          GOOS=windows GOARCH=amd64 go test -c -o "$RUNNER_TEMP/dcm-docx.test.exe" .
      - name: Save exact native status fix
        run: |
          git config user.name 'DCM reviewed-patch automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-src/main_windows.go
          git commit -m 'fix: identify active native preview instead of retaining stale text status'
          git push origin HEAD:release/v1.0.71
