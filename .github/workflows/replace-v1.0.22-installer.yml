name: Replace v1.0.22 Installer Asset

on:
  push:
    paths:
      - ".github/workflows/replace-v1.0.22-installer.yml"

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify exact installer
        run: |
          curl -L --fail --retry 3 'https://sdmntprcentralindia.oaiusercontent.com/files/00000000-6ee4-8208-a260-5731c9286c93/raw?se=2026-09-21T07%3A05%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=07f3370a-7c6f-5958-946c-dce4909166e8&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T01%3A32%3A52Z&ske=2026-09-22T01%3A32%3A52Z&sks=b&skv=2026-02-06&sig=fHHMnB6Mlkalykic4Ogdpk2gaw7RQ%2BsTuhgi/vhkYIE%3D' -o DCM-QuickSort-Setup-v1.0.22.exe
          echo "538244cf8fe5013a1a7f2a14da4c087bcb2a0c388c4088df9e17d988e2e4f0d6  DCM-QuickSort-Setup-v1.0.22.exe" | sha256sum -c -
          file DCM-QuickSort-Setup-v1.0.22.exe

      - name: Replace release installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.22 DCM-QuickSort-Setup-v1.0.22.exe             --clobber             --repo laxmanxp/dcm-quick-sort

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.22             --repo laxmanxp/dcm-quick-sort             --json name,tagName,url,assets
