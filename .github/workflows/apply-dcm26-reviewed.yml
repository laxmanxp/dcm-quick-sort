name: Apply reviewed DCM-26 text changes
on:
  push:
    branches: [release/v1.0.71]
    paths:
      - qualification/proposed-fixes/dcm26-reviewed.json
      - .github/workflows/apply-dcm26-reviewed.yml
permissions:
  contents: write
concurrency:
  group: dcm26-reviewed-patch
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.71
      - name: Apply exact locally authored replacements
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          proposal = json.loads(pathlib.Path('qualification/proposed-fixes/dcm26-reviewed.json').read_text())
          allowed = {'app-src/core.go', 'app-src/main_windows.go', 'tools/test-ui-text.ps1'}
          paths = [item['path'] for item in proposal['files']]
          assert paths and len(paths) == len(set(paths)) and set(paths) <= allowed
          pending = []
          for item in proposal['files']:
              path = pathlib.Path(item['path'])
              original = path.read_bytes()
              blob = hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()
              assert blob == item['before_blob'], (item['path'], 'base changed')
              text = original.decode('utf-8')
              for change in item['replacements']:
                  assert text.count(change['old']) == 1, ('ambiguous patch', item['path'])
                  text = text.replace(change['old'], change['new'])
              data = text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == item['after_sha256']
              pending.append((path, data))
          for path, data in pending:
              path.write_bytes(data)
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) == set(paths)
          PY
          git diff --check
          git config user.name 'DCM reviewed-patch automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-src/core.go app-src/main_windows.go tools/test-ui-text.ps1
          git commit -m 'fix: apply exact reviewed DCM-26 text changes'
          git push origin HEAD:refs/heads/release/v1.0.71
