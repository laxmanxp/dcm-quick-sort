name: Record optional Sumatra stage 1
on:
  push:
    branches: [release/v1.0.71]
    paths: [.github/workflows/record-sumatra-stage1.yml]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact locally validated tracker update
        run: python qualification/record-sumatra-stage1.py
      - name: Verify output identities and commit only metadata
        run: |
          echo 'ab31c4cd925a76c2ebdb5428f1082ff677149d35825b40889924b7c4b8635207  todo.json' | sha256sum -c -
          echo '5391440831e07c9e18bb6b7cf7f3db5ec0fa251f12a364b8cef25f6acdb9993b  qualification/completion-50.json' | sha256sum -c -
          git config user.name 'DCM reviewed-checkpoint automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add todo.json qualification/completion-50.json
          git commit -m 'test: record optional Sumatra progress and retain open PDF gates'
          git push origin HEAD:release/v1.0.71
