name: Apply reviewed DCM-24 selection patch
on:
  push:
    branches: [release/v1.0.71]
    paths:
      - qualification/proposed-fixes/dcm24-selection.json
      - .github/workflows/apply-dcm24-reviewed.yml
permissions:
  contents: write
concurrency:
  group: dcm24-reviewed-patch
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.71
      - name: Apply exact locally authored replacement
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PYCODE'
          import hashlib, json, pathlib
          proposal = json.loads(pathlib.Path('qualification/proposed-fixes/dcm24-selection.json').read_text())
          assert len(proposal['files']) == 1
          item = proposal['files'][0]
          assert item['path'] == 'app-src/main_windows.go'
          p = pathlib.Path(item['path'])
          raw = p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == item['before_blob']
          text = raw.decode('utf-8')
          for change in item['replacements']:
              assert text.count(change['old']) == 1
              text = text.replace(change['old'], change['new'])
          data = text.encode('utf-8')
          assert hashlib.sha256(data).hexdigest() == item['after_sha256']
          p.write_bytes(data)
          PYCODE
          git diff --check
          test "$(git diff --name-only)" = 'app-src/main_windows.go'
          git config user.name 'DCM reviewed-patch automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-src/main_windows.go
          git commit -m 'fix: align Ctrl deselection preview and Move with selected files'
          git push origin HEAD:refs/heads/release/v1.0.71
