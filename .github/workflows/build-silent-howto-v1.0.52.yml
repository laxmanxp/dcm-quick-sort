name: Build silent captioned DCM how-to v1.0.52

on:
  push:
    paths:
      - ".github/workflows/build-silent-howto-v1.0.52.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build silent captioned video
        run: |
          ffmpeg -y \
            -i media/DCM-QuickSort-Fullscreen-HeyGen-Demo.mp4 \
            -vf "pad=1280:840:0:0:color=black,subtitles=media/DCM-QuickSort-How-To-v1.0.52.srt:force_style='FontName=DejaVu Sans,FontSize=22,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BackColour=&H00000000,BorderStyle=1,Outline=1,Shadow=0,MarginV=20,Alignment=2'" \
            -an \
            -c:v libx264 -preset medium -crf 20 \
            -movflags +faststart \
            media/DCM-QuickSort-How-To-v1.0.52.mp4

      - name: Verify video
        run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height -of json media/DCM-QuickSort-How-To-v1.0.52.mp4
          AUDIO_STREAMS="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 media/DCM-QuickSort-How-To-v1.0.52.mp4)"
          test -z "$AUDIO_STREAMS"
          python3 - <<'PY'
          import json, subprocess
          p='media/DCM-QuickSort-How-To-v1.0.52.mp4'
          data=json.loads(subprocess.check_output([
              'ffprobe','-v','error',
              '-show_entries','stream=codec_type,codec_name,width,height',
              '-show_entries','format=duration',
              '-of','json',p
          ]))
          assert [s['codec_type'] for s in data['streams']] == ['video'], data
          assert data['streams'][0]['codec_name'] == 'h264', data
          assert int(data['streams'][0]['width']) == 1280, data
          assert int(data['streams'][0]['height']) == 840, data
          assert 47.0 <= float(data['format']['duration']) <= 49.5, data
          print('SILENT_CAPTION_BAND_VIDEO_OK')
          PY

      - name: Verify app screen is preserved above caption band
        run: |
          ffmpeg -y -ss 12 -i media/DCM-QuickSort-Fullscreen-HeyGen-Demo.mp4 \
            -frames:v 1 -vf "scale=1280:720" /tmp/source.png
          ffmpeg -y -ss 12 -i media/DCM-QuickSort-How-To-v1.0.52.mp4 \
            -frames:v 1 -vf "crop=1280:720:0:0" /tmp/output-top.png
          ffmpeg -i /tmp/source.png -i /tmp/output-top.png \
            -lavfi "ssim=stats_file=/tmp/ssim.log" -f null - 2>&1 | tee /tmp/ssim-output.txt
          python3 - <<'PY'
          import re
          s=open('/tmp/ssim-output.txt',encoding='utf-8',errors='ignore').read()
          m=re.findall(r'All:([0-9.]+)',s)
          assert m, s[-2000:]
          score=float(m[-1])
          assert score > 0.90, score
          print('APP_SCREEN_PRESERVED_OK', score)
          PY

      - name: Verify captions occupy separate lower band
        run: |
          ffmpeg -y -ss 12 -i media/DCM-QuickSort-How-To-v1.0.52.mp4 \
            -frames:v 1 \
            -vf "crop=1280:120:0:720,signalstats,metadata=print:file=/tmp/band-stats.txt" \
            -f null -
          python3 - <<'PY'
          import re
          s=open('/tmp/band-stats.txt',encoding='utf-8',errors='ignore').read()
          yavg=re.findall(r'lavfi\.signalstats\.YAVG=([0-9.]+)',s)
          ymax=re.findall(r'lavfi\.signalstats\.YMAX=([0-9.]+)',s)
          assert yavg and ymax, s
          avg=float(yavg[-1]); mx=float(ymax[-1])
          assert avg < 80, (avg,mx)
          assert mx > 150, (avg,mx)
          print('CAPTION_BAND_CONTENT_OK', avg, mx)
          PY

      - name: Update website copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ('index.html','how-to.html'):
              p=Path(fn)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=s.replace(
                  'A silent, captioned walkthrough of the Quick Sort workflow: choose a source, filter, preview, rename, choose a destination, move, and continue.',
                  'A silent, captioned walkthrough with the DCM screen kept fully visible above a dedicated caption band.'
              )
              s=s.replace(
                  'This video has no audio. Instructions are shown as captions inside the video.',
                  'This video has no audio. The DCM screen stays fully visible, with instructions shown in a separate caption band underneath.'
              )
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit generated video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/DCM-QuickSort-How-To-v1.0.52.mp4 media/DCM-QuickSort-How-To-v1.0.52.srt index.html how-to.html
          git commit -m "Move DCM how-to captions below app screen [skip ci]"
          git push origin HEAD:main
