name: PDF preview rotation development checks

on:
  push:
    branches:
      - feature/shared-flowpdf-pdfium-provider
    paths:
      - ".github/workflows/pdf-rotation-feature-ci.yml"
      - "app-src/pdf_preview.go"
      - "app-src/pdf_preview_windows.go"
      - "app-src/pdf_preview_test.go"
      - "app-src/pdf_rotation_windows_test.go"
      - "app-src/pdfium_persistent_windows.go"
      - "app-src/pdfium_persistent_windows_test.go"
      - "app-src/assets/pdf_render.ps1"
      - "app-src/main_windows.go"
      - "app-src/actual_filename.go"
      - "app-src/actual_filename_test.go"
      - "app-src/pdf_cursor_anchor_test.go"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rotation:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: app-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app-src/go.mod
          cache: false
      - name: Build normal Windows PDF preview
        run: go build .
      - name: Build PDFium development-default preview
        run: go build -tags pdfium_dev .
      - name: Filename visibility, rotation and provider policy tests
        run: go test -tags pdfium_dev -run "TestActualFileDisplay|TestPDFCursorAnchor|TestPDFRotation|TestPDFRenderer|TestBundledPDFRenderer|TestPDFProvider" -count=1 -v .
      - name: Create disposable two-page PDF for Windows.Data.Pdf
        working-directory: .
        shell: powershell
        run: |
          . .\tests\native\new-fixtures.ps1
          $fixture = New-DcmFixtures (Join-Path $env:RUNNER_TEMP 'pdf-rotation-fixture')
          $pdf = Join-Path $fixture.inbox '08-preview.pdf'
          Add-Content -Path $env:GITHUB_ENV -Value ("DCM_PDFIUM_TEST_PDF=" + $pdf)
      - name: Verify real Windows.Data.Pdf quarter-turn rendering
        shell: powershell
        env:
          DCM_PDF_ROTATION_ACCEPTANCE: "1"
        run: go test -tags pdfium_dev -run "TestWindowsDataPDFRotationQuarterTurns" -count=1 -v .
