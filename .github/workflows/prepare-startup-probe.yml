name: Prepare exact startup measurement
on:
  push:
    branches: [release/v1.0.71]
    paths: [.github/workflows/prepare-startup-probe.yml, qualification/prepare-startup-probe.py]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify local source identities and wire diagnostic
        run: python qualification/prepare-startup-probe.py
      - name: Commit only intended wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'DCM reviewed-tooling automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-src/main_windows.go app-src/sumatra_preview_windows.go app-src/sumatra_document_windows.go tools/flowdev-dcm/config/checks.json
          git commit -m 'test: wire opt-in startup stage trace and queued heartbeat'
          git push origin HEAD:release/v1.0.71
